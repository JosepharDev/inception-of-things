<svg width="1400" height="360" viewBox="0 0 1400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IOT roadmap">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1400" height="360" rx="20" fill="#0f172a"/>
  <text x="40" y="52" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Project progression</text>
  <rect x="40" y="110" width="290" height="170" rx="14" fill="#1e3a8a"/>
  <text x="64" y="152" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">P1</text>
  <text x="64" y="180" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">2 VMs with Vagrant</text>
  <text x="64" y="206" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">K3s server + worker</text>
  <text x="64" y="232" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Token join flow</text>

  <rect x="390" y="110" width="290" height="170" rx="14" fill="#6d28d9"/>
  <text x="414" y="152" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">P2</text>
  <text x="414" y="180" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Single K3s node</text>
  <text x="414" y="206" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">3 apps + Ingress</text>
  <text x="414" y="232" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Host-based routing</text>

  <rect x="740" y="110" width="290" height="170" rx="14" fill="#0f766e"/>
  <text x="764" y="152" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">P3</text>
  <text x="764" y="180" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">K3d local cluster</text>
  <text x="764" y="206" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Argo CD install</text>
  <text x="764" y="232" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">GitOps auto-sync</text>

  <rect x="1090" y="110" width="270" height="170" rx="14" fill="#334155"/>
  <text x="1112" y="152" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Bonus</text>
  <text x="1112" y="180" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Self-hosted GitLab</text>
  <text x="1112" y="206" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Argo from private repo</text>

  <line x1="330" y1="195" x2="390" y2="195" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="195" x2="740" y2="195" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1030" y1="195" x2="1090" y2="195" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
